<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quant Research Platform · 研究台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--dim:#9aa3b2;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650}
  .sub{color:var(--dim);font-size:12px}
  nav{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
  button.act{background:#1b2430;border:1px solid #2f6feb;color:#e6edf3;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin-right:8px}
  button.act[disabled]{opacity:.45;cursor:not-allowed;border-color:#263140}
  nav button[aria-current="true"]{background:var(--panel);color:var(--fg);border-color:var(--acc)}
  main{padding:16px 20px;max-width:1400px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
  .kv{font-size:13px}.kv b{color:var(--dim);font-weight:500;margin-right:6px}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--dim)}
  .ok{color:var(--ok);border-color:var(--ok)}.warn{color:var(--warn);border-color:var(--warn)}
  .bad{color:var(--bad);border-color:var(--bad)}.acc{color:var(--acc);border-color:var(--acc)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{color:var(--dim);font-weight:500}
  .verdict{font-size:20px;font-weight:700;letter-spacing:.5px}
  details{margin-top:8px}summary{cursor:pointer;color:var(--dim);font-size:13px}
  pre{background:#0b0d11;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:12px;max-height:340px}
  .empty{color:var(--dim);font-size:13px;padding:10px 0}
  .note{color:var(--dim);font-size:12px;margin-top:6px}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Quant Research Platform</h1>
  <span class="sub">多市场量化策略研发与控制平台 · 研究台(只读;审批与激活需 Founder 令牌)</span>
  <span class="sub" id="stamp"></span>
  <span class="sub">Founder 令牌 <input id="founder-token" type="password" placeholder="X-Founder-Token(仅本页内存,不落盘)" style="background:#0e131a;border:1px solid #263140;color:#e6edf3;border-radius:6px;padding:4px 8px;font-size:12px;width:220px"></span>
</header>
<nav id="nav"></nav>
<main id="view"><div class="empty">加载中…</div></main>

<script>
const TABS = [
  ['strategies','策略'], ['experiments','实验'], ['races','赛马'],
  ['shadow','影子/前向'], ['promotion','发布'], ['runtime-status','运行状态'],
];
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild; };
const esc = (s) => String(s==null?'':s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num = (v,d=4) => (v==null||Number.isNaN(v))?'—':(typeof v==='number'?v.toFixed(d):esc(v));
const tag = (t,cls='') => `<span class="tag ${cls}">${esc(t)}</span>`;
const statusCls = (s) => ({ACTIVE:'ok',CHALLENGER_WINS:'ok',HEALTHY:'ok',CLAIM_ELIGIBLE:'ok',APPROVED_PAPER:'ok',
  PENDING_RUNTIME_PULL:'warn',DESCRIBE_ONLY:'warn',PENDING_FOUNDER_REVIEW:'warn',UNAVAILABLE:'warn',UNSUPPORTED:'warn',
  NEGATIVE_RESULT:'bad',ACK_REJECTED:'bad',RUNTIME_REJECTED:'bad',COMPATIBILITY_FAILED:'bad',ROLLED_BACK:'bad'}[s]||'');
const mfe = (v) => (v==null?'—':(typeof v==='object'
  ? esc(`总量 ${v.default}` + (v.by_regime&&Object.keys(v.by_regime).length?` · 分 Regime ${JSON.stringify(v.by_regime)}`:''))
  : esc(v)));
const json = (o,label='原始对象') => `<details><summary>${label}</summary><pre>${esc(JSON.stringify(o,null,2))}</pre></details>`;

const render = {
  strategies: (d) => `
    ${card('已注册市场 Adapter', d.markets.map(m=>`${tag(m.market_id,'acc')} ${esc(m.adapter_version)} · ${esc(m.repo_ref)}`).join('<br>') || '—')}
    ${table('策略族(Family)', ['family_id','市场','经济机制','目标','状态'],
      d.families.map(f=>[f.family_id, (f.market_scope||[]).join(','), f.economic_mechanism, f.strategy_goal, tag(f.lifecycle_status)]))}
    ${table('Bundle(Champion / Challenger / Shadow / Active / Retired)',
      ['bundle_id','版本','市场','状态','bundle_hash','生效日','activationRef'],
      d.bundles.map(b=>[b.bundle_id,'v'+b.bundle_version,b.market,tag(b.status,statusCls(b.status)),b.bundle_hash,b.effective_from||'—',b.activationRef||'—']))}
    ${table('模块版本', ['module_id','版本','类型','市场','状态','parameter_hash'],
      d.modules.map(m=>[m.module_id,'v'+m.version,m.module_type,m.market,tag(m.status,statusCls(m.status)),m.parameter_hash]))}`,

  experiments: (d) => `
    ${table('研究假设(机制 / 失败条件 / 主指标 / 守卫)', ['hypothesis_id','研究问题','预期机制','主指标','失败条件'],
      d.hypotheses.map(h=>[h.hypothesis_id,h.research_question,h.expected_mechanism,tag(h.primary_metric,'acc'),h.failure_condition]))}
    ${d.experiments.map(e=>`<div class="card">
      <h3>${esc(e.experiment_id)} ${tag(e.status,statusCls(e.status))} ${e.freeze_verified?tag('冻结完好','ok'):tag('冻结校验失败','bad')}</h3>
      <div class="row">
        <span class="kv"><b>changed_component</b>${esc(e.changed_component)}</span>
        <span class="kv"><b>主指标</b>${esc(e.primary_metric)}</span>
        <span class="kv"><b>freeze_hash</b>${esc(e.freeze_hash)}</span>
        <span class="kv"><b>OOS 起点</b>${esc(e.sample&&e.sample.oos_start)}</span>
        <span class="kv"><b>成本/边</b>${esc(e.costs&&e.costs.cost_per_side)}</span>
        <span class="kv"><b>最低前向样本</b>${mfe(e.min_forward_evidence)}</span>
        <span class="kv"><b>Survivorship</b>${esc((e.universe&&e.universe.survivorship_policy)||'未声明')}</span>
      </div>
      ${e.backtest?`<div class="row" style="margin-top:8px">
        <span class="kv"><b>OOS good_precision</b>champ ${num(e.backtest.precision_oos&&e.backtest.precision_oos.champion.good_precision)} → chal ${num(e.backtest.precision_oos&&e.backtest.precision_oos.challenger.good_precision)}</span>
        <span class="kv"><b>result_hash</b>${esc(e.backtest.result_hash)}</span></div>`:'<div class="note">尚无回测产物</div>'}
      ${e.wfo?`<div class="row" style="margin-top:8px">
        <span class="kv"><b>WFO</b>${e.wfo.evaluated_fold_count}/${e.wfo.fold_count} fold · challenger 胜出 ${num(e.wfo.challenger_win_fraction,2)}</span>
        <span class="kv"><b>选参稳定性</b>${esc(e.wfo.stabilityCn)}</span></div>
        ${table('', ['fold','train','test','选中参数','test champ','test chal'],
          e.wfo.folds.map(f=>[f.fold, f.train_from+'..'+f.train_to, f.test_from+'..'+f.test_to,
            f.selected_params?JSON.stringify(f.selected_params):f.status, num(f.test_champion), num(f.test_challenger)]))}`
        :'<div class="note">未运行 WFO</div>'}
      ${e.robustness?`<div class="row" style="margin-top:8px"><span class="kv"><b>鲁棒性</b>${e.robustness.decidable_trial_count} 次可判扰动 · challenger 占优 ${num(e.robustness.challenger_better_fraction,2)}</span></div>
        <div class="row">${Object.entries(e.robustness.dimensions).map(([k,v])=>tag(k+':'+v.status, v.status==='EVALUATED'?'ok':'warn')).join(' ')}</div>`
        :'<div class="note">未运行鲁棒性检验</div>'}
      ${e.result?`<div class="row" style="margin-top:8px"><span class="kv"><b>已锁结果</b>${tag(e.result.verdict,statusCls(e.result.verdict))}</span></div>`:''}
      ${json(e)}
    </div>`).join('') || empty('尚无实验')}
    ${table('负结果台账(资产,不丢弃)', ['negative_result_id','假设','失败原因','归档时间'],
      d.negative_results.map(n=>[n.negative_result_id,n.hypothesis_ref,n.failure_reason,n.archived_at]))}
    ${table('因子定义(§9.1 Factor Lab —— 只提供统计信息,无生产动作权)',
      ['factor_id','版本','方向','horizons','最近 IC 均值','动作权'],
      d.factors.map(f=>{
        const ev = (f.evaluations||[]).slice(-1)[0];
        const ic = ev ? Object.values(ev.by_horizon).map(c=>`${c.horizon_days}d:${num(c.ic_mean,4)}`).join(' · ') : '未评估';
        return [f.factor_id,'v'+f.version,f.direction,(f.horizons||[]).join('/'),ic,tag(f.production_action_authority,'warn')];
      }))}`,

  races: (d) => d.races.map(r=>{
    const res = r.result;
    return `<div class="card">
      <h3>${esc(r.race_id)} ${tag(r.race_type)} ${tag(r.status,statusCls(r.status))}</h3>
      ${res?`
        <div class="row" style="margin:6px 0 10px">
          <span class="verdict ${statusCls(res.conclusion)}">${esc(res.conclusion)}</span>
          <span class="kv"><b>主指标 ${esc(res.primary_metric)}</b>champion ${num(res.champion_value)} → challenger ${num(res.challenger_value)}</span>
          <span class="kv"><b>守卫</b>${res.guardrail_result.map(g=>tag(g.id+(g.breached?' 违约':' 通过'), g.breached?'bad':'ok')).join(' ')}</span>
        </div>
        <div class="row"><span class="kv"><b>受控变量</b>${esc(r.changed_component)} · paired sample ${r.paired_sample_count} 条</span></div>
        ${res.regime_breakdown&&res.regime_breakdown.status==='EVALUATED'?`
          <div class="row" style="margin-top:8px"><span class="kv"><b>Regime 稳定性</b>challenger 在 ${num(res.regime_breakdown.stability,2)} 比例的 Regime 下占优 · 口径 ${esc(res.regime_breakdown.regime_model)}</span></div>
          ${table('', ['Regime','样本','champ GOOD 精度','chal GOOD 精度','challenger 更优'],
            Object.entries(res.regime_breakdown.by_regime).map(([k,v])=>[k,v.sample_count,num(v.champion.good_precision),num(v.challenger.good_precision),
              v.challenger_better_good_precision==null?'—':(v.challenger_better_good_precision?tag('是','ok'):tag('否','warn'))]))}`
          :`<div class="note">Regime 分解:${esc(res.regime_breakdown&&res.regime_breakdown.status||'无')}</div>`}
        ${res.canonical_metrics?json(res.canonical_metrics,'七轴 Canonical 指标'):''}
        ${json(res,'RaceResult 全量')}`
      :'<div class="note">尚未出结果</div>'}
    </div>`; }).join('') || empty('尚无赛马'),

  shadow: (d) => d.runs.map(s=>`<div class="card">
      <h3>${esc(s.shadow_id)} ${tag(s.status,statusCls(s.status))} ${tag(s.sufficiency.claim_status,statusCls(s.sufficiency.claim_status))}</h3>
      <div class="row">
        <span class="kv"><b>前向样本</b>${s.sufficiency.forward_sample_count}/${s.sufficiency.min_required}</span>
        <span class="kv"><b>分歧</b>${s.sufficiency.disagreement_count}</span>
        <span class="kv"><b>Virtual Ledger</b>${esc(s.virtual_ledger_ref)}</span>
        <span class="kv"><b>事件流</b>${esc(s.market_event_stream_ref)}</span>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="kv"><b>虚拟净值</b>champion ${num(s.forward_metrics.champion_virtual_nav,6)} · challenger ${num(s.forward_metrics.challenger_virtual_nav,6)} · 超额 ${num(s.forward_metrics.virtual_excess,6)}</span>
        <span class="kv"><b>已完成/未完成窗口</b>${s.forward_metrics.complete_observation_count}/${s.forward_metrics.incomplete_observation_count}</span>
      </div>
      <div class="note">${esc(s.forward_metrics.claimCn)}</div>
      ${s.halted_reason?`<div class="row" style="margin-top:6px">${tag('已停止:'+s.halted_reason+'('+s.halted_failure_class+')','bad')}</div>`:''}
      ${table('最近观察', ['业务日','一致','champion 输出','challenger 输出','数据质量'],
        s.observations.slice(-12).reverse().map(o=>[o.business_date, o.agree?tag('一致','ok'):tag('分歧','warn'),
          (o.champion_output||[]).join(' ')||'—', (o.challenger_output||[]).join(' ')||'—', o.data_quality]))}
    </div>`).join('') || empty('尚无影子运行'),

  promotion: (d) => `
    ${d.candidates.map(c=>`<div class="card">
      <h3>${esc(c.candidate_id)} ${tag(c.review_status,statusCls(c.review_status))}</h3>
      <div class="row">
        <span class="kv"><b>候选 Bundle</b>${esc(c.release_candidate_ref)}</span>
        <span class="kv"><b>实验</b>${esc(c.experiment_ref)}</span>
        <span class="kv"><b>回滚锚</b>${esc(c.rollback_ref)}</span>
        <span class="kv"><b>迁移策略</b>${esc(c.migration_policy)}</span>
      </div>
      <div class="row"><span class="kv"><b>兼容性</b>${c.compatibility_result?(c.compatibility_result.compatible?tag('通过','ok'):tag('失败:'+c.compatibility_result.reasons.join(';'),'bad')):tag('未检查','warn')}</span></div>
      ${c.unresolved_gaps&&c.unresolved_gaps.length?`<div class="row">${c.unresolved_gaps.map(g=>tag(g,'warn')).join(' ')}</div>`:''}
      ${founderActions(c, d)}
    </div>`).join('') || empty('尚无发布候选')}
    ${table('不可变 Release', ['release_id','bundle','release_hash','adapter','目标环境','创建时间'],
      d.releases.map(r=>[r.release_id,r.immutable_bundle_ref,r.release_hash,r.adapter_version,r.target_runtime_class,r.created_at]))}
    ${table('Activation(Runtime 到生效日拉取并验哈希后才 ACTIVE)',
      ['activation_id','release','runtime','环境','生效日','状态','ACK'],
      dedupe(d.activations,'activation_id').map(a=>[a.activation_id,a.release_id,a.target_runtime_id,a.environment,a.effective_from,
        tag(a.activation_status,statusCls(a.activation_status)),a.runtime_ack||'—']))}
    ${table('迁移裁定 / REPLAN_REQUIRED(No Silent Migration)', ['类型','activation','持仓','原 release','状态/动作'],
      d.migration.map(m=>[m.schema, m.activation_ref, m.position_ref||'—', m.originating_release_ref||m.previous_release_ref||'—',
        m.schema==='REPLAN_REQUIRED_V1'?tag(m.required_action,'warn'):tag(m.status,statusCls(m.status))]))}
    ${table('回滚记录', ['类型','activation','恢复到','批准人','时间'],
      d.rollbacks.map(r=>[tag(r.type||r.schema), r.activation_ref, r.restored_release_ref||'—', r.approved_by||'—', r.rolledBackAt||r.triggeredAt]))}`,

  'runtime-status': (d) => d.runtimes.map(r=>`<div class="card">
      <h3>${esc(r.runtime_id)} · ${esc(r.market)} ${tag(r.health.status||r.health.reason,statusCls(r.health.status))}</h3>
      <div class="row">
        <span class="kv"><b>环境</b>${(r.capabilities.environments_supported||[]).join(',')}</span>
        <span class="kv"><b>real_order</b>${tag(r.capabilities.real_order,'ok')}</span>
        <span class="kv"><b>broker 连接</b>${tag(String(r.capabilities.broker_connection),'ok')}</span>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="kv"><b>当前生效 Release</b>${esc((r.active_release&&r.active_release.active_release)||r.active_release.status||'—')}</span>
        <span class="kv"><b>release_hash</b>${esc((r.active_release&&r.active_release.release_hash)||'—')}</span>
      </div>
      <div class="row">
        <span class="kv"><b>待拉取</b>${r.pending_pull.length}</span>
        <span class="kv"><b>已批准未生效</b>${r.scheduled_not_yet_effective.map(a=>a.activation_id+'@'+a.effective_from).join(' ')||'—'}</span>
      </div>
      <div class="row"><span class="kv"><b>持仓只读</b>${esc(r.positions.status)} ${r.positions.reasonCn?('· '+esc(r.positions.reasonCn)):''}</span></div>
      <div class="row"><span class="kv"><b>绩效只读</b>${esc(r.performance_summary.status)} ${r.performance_summary.reasonCn?('· '+esc(r.performance_summary.reasonCn)):''}</span></div>
      <div class="note">${esc(r.readOnlyCn)}</div>
    </div>`).join('') || empty('尚无 Runtime'),
};

/**
 * §12.1「一键发布」的产品语义:按钮只对**已通过全部 Gate** 的候选可用;
 * 点击不复制代码、不重启进程 —— 只创建不可变 Release 的受控 Activation,
 * 仍要 Runtime 到生效日主动拉取 + 验哈希 + 健康检查才 ACTIVE(§12.2)。
 * 写操作一律带 Founder 令牌;未填令牌时按钮禁用(fail-closed,§18)。
 */
function founderActions(c, d){
  const rel = d.releases.find(r=>r.candidate_ref===c.candidate_id) || null;
  const gatePassed = !!(c.compatibility_result && c.compatibility_result.compatible);
  if(c.review_status==='PENDING_FOUNDER_REVIEW'){
    return `<div class="row" style="margin-top:10px">
      <button class="act" data-action="review" data-candidate="${esc(c.candidate_id)}" ${gatePassed?'':'disabled'}>批准发布到 PAPER(Founder)</button>
      <button class="act" data-action="reject" data-candidate="${esc(c.candidate_id)}">否决</button>
      <span class="note">${gatePassed?'全部 Gate 已通过':'兼容性未通过 —— 按钮不可用'}</span>
    </div>`;
  }
  if(c.review_status==='APPROVED_PAPER' && rel){
    const已激活 = d.activations.some(a=>a.release_id===rel.release_id);
    return `<div class="row" style="margin-top:10px">
      <button class="act" data-action="activate" data-release="${esc(rel.release_id)}" ${已激活?'disabled':''}>创建 Activation(PAPER,次日生效)</button>
      <span class="note">${已激活?'已创建 Activation':'创建后仍需 Runtime 到生效日拉取并验哈希才 ACTIVE'}</span>
    </div>`;
  }
  return '';
}

async function runAction(btn){
  const token = document.getElementById('founder-token').value.trim();
  if(!token){ alert('请先填入 Founder 令牌(X-Founder-Token)'); return; }
  const a = btn.dataset.action;
  const body = a==='activate'
    ? { release_id: btn.dataset.release, environment:'PAPER',
        target_runtime_id: (window.__runtimeIds&&window.__runtimeIds[0])||'',
        effective_from: new Date(Date.now()+86400000).toISOString().slice(0,10) }
    : { candidate_id: btn.dataset.candidate, decision: a==='review'?'APPROVE_PAPER':'REJECT' };
  const path = a==='activate' ? '/api/activate' : '/api/review';
  btn.disabled = true;
  try{
    const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Founder-Token':token},body:JSON.stringify(body)});
    const j = await r.json();
    if(!r.ok){ alert(`失败(${r.status}):${j.reasonCn||j.error}`); btn.disabled=false; return; }
    await load();
  }catch(e){ alert(String(e)); btn.disabled=false; }
}

function card(title, html){ return `<div class="card"><h3>${esc(title)}</h3>${html}</div>`; }
function empty(t){ return `<div class="card"><div class="empty">${esc(t)}</div></div>`; }
function dedupe(rows,key){ const m=new Map(); for(const r of rows) m.set(r[key],r); return [...m.values()]; }
function table(title, cols, rows){
  if(!rows||!rows.length) return title?card(title,'<div class="empty">—</div>'):'';
  const head = `<tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`;
  const body = rows.map(r=>`<tr>${r.map(c=>`<td>${typeof c==='string'&&c.startsWith('<span')?c:esc(c)}</td>`).join('')}</tr>`).join('');
  const t = `<div class="wrap"><table>${head}${body}</table></div>`;
  return title?card(title,t):t;
}

let current = location.hash.slice(1) || 'strategies';
function paint(){
  document.getElementById('nav').replaceChildren(...TABS.map(([k,label])=>{
    const b=document.createElement('button'); b.textContent=label; b.setAttribute('aria-current', String(k===current));
    b.onclick=()=>{ current=k; location.hash=k; load(); paint(); }; return b;
  }));
}
async function load(){
  const view=document.getElementById('view');
  view.innerHTML='<div class="empty">加载中…</div>';
  try{
    const r = await fetch('/api/'+current);
    const d = await r.json();
    view.innerHTML = render[current](d);
    for(const b of view.querySelectorAll('button.act')) b.onclick = () => runAction(b);
    document.getElementById('stamp').textContent = '读取于 ' + new Date().toLocaleString('zh-CN');
  }catch(e){ view.innerHTML = `<div class="card"><div class="empty">读取失败:${esc(e.message)}</div></div>`; }
}
// 直接访问 #tab、浏览器前进/后退都要正确切换(同文档导航不会重载脚本)
window.addEventListener('hashchange', () => {
  const next = location.hash.slice(1) || 'strategies';
  if (next !== current && render[next]) { current = next; fetch('/api/runtime-status').then(r=>r.json())
  .then(d=>{ window.__runtimeIds = (d.runtimes||[]).map(r=>r.runtime_id); })
  .catch(()=>{ window.__runtimeIds = []; });
paint(); load(); }
});

</script>
