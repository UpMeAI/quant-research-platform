<body>
<a class="skip" href="#workspace">跳到当前页面内容</a>
<header class="app-head"><div class="brand-row"><div class="brand"><span class="brand-mark" aria-hidden="true">R</span><div><h1>Research 研究工作台</h1><p>Cycle × Research × Desk · 用证据理解策略，不替你做交易决定</p></div></div><span class="read-only">只读安全模式</span></div></header>
<section class="context-shell" aria-label="当前查看范围"><div class="context-row"><div class="context-copy"><p class="eyebrow" id="context-eyebrow">当前查看范围</p><h2 id="context-title">正在读取…</h2><p id="context-subtitle">读取 Desk 策略目录与真实研究关联</p></div><div class="context-select" id="context-picker"></div></div></section>
<div class="tab-shell"><nav id="nav" aria-label="Research 用户任务"></nav></div>
<main id="workspace" tabindex="-1"><div class="loading" role="status">正在读取 Desk 策略目录…</div></main>
<script>
'use strict';
const TOP_ROUTES=['strategies','experiments','shadow','promotion','runtime-status'];
const KNOWN_ROUTES=new Set([...TOP_ROUTES,'strategy-detail','runtime-research-loop','races']);
const $=(id)=>document.getElementById(id);
const esc=(value)=>String(value==null?'':value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const stateTone=(state)=>({AVAILABLE:'ok',CONNECTED:'ok',ACTUAL_CASE_CONNECTED:'ok',READY:'ok',VALID:'ok',RUNNING:'ok',OPEN:'ok',HAS_RESEARCH_QUESTION:'info',HAS_LOCKED_RESULT:'info',RESULT_LOCKED:'info',RESEARCHING:'info',HAS_FORWARD_RUN:'info',DECIDED:'info',OBSERVING:'info',FROZEN_BASELINE:'info',RUN_OFF:'warn',NOT_YET_EFFECTIVE:'warn',EMPTY:'',NOT_CONNECTED:'',NO_ACTUAL_CASE:'warn',DEGRADED:'warn',STALE:'warn',UNKNOWN:'warn',MISSING:'bad',UNAVAILABLE:'bad',INVALID:'bad',BLOCKED:'bad',NOT_VERIFIED:'warn',CONTROLLED_VERIFIED:'info',TARGET_DELIVERED:'ok',OUT_OF_SCOPE:'',CLOSED:''})[state]||'';
const pill=(label,state='')=>`<span class="pill ${stateTone(state)}">${esc(label)}</span>`;
const tech=(items,title='技术详情')=>{const rows=(items||[]).filter(Boolean);if(!rows.length)return '';return `<details class="technical"><summary>${esc(title)}</summary><div class="detail-body"><dl>${rows.map((item)=>`<dt>${esc(item.label)}</dt><dd><code>${esc(item.value)}</code></dd>`).join('')}</dl></div></details>`;};
const answerPanel=(view)=>`<section class="answer-panel" aria-labelledby="page-question"><p class="eyebrow">本页要回答</p><h2 id="page-question">${esc(view.question)}</h2><p class="answer">${esc(view.answer)}</p><p class="next">下一步：${esc(view.next_step)}</p></section>`;
const emptyState=(title,copy)=>`<section class="empty-state"><h3>${esc(title)}</h3><p>${esc(copy)}</p></section>`;
function routeInfo(){const raw=location.hash.slice(1)||'strategies';const [name,query='']=raw.split('?');return {name:KNOWN_ROUTES.has(name)?name:'strategies',params:new URLSearchParams(query)};}
function effectiveRoute(){const name=routeInfo().name;return name==='runtime-research-loop'?'strategy-detail':name==='races'?'experiments':name;}
/**
 * 修订 7 J2：策略详情的页签——默认「总览」；`section=` 选页签（旧链接 section=runtime 等照旧有效），`section=all` 是全部展开的核对视图。
 * `card=Q5` 定位并展开研究与对比里的那张卡（没写 section 时进「研究与对比」）；`block=account` 定位回测结论卡的那一块（没写 section 时进「运行概览」）。
 */
const DETAIL_TABS=[['overview','总览'],['runtime','运行概览'],['health','体检与证据'],['research','研究与对比'],['forward','前向观察'],['review','复盘与采用']];
const TAB_KEYS=new Set(DETAIL_TABS.map(([key])=>key));
function detailRoute(){const info=routeInfo();const card=info.params.get('card');const block=info.params.get('block');let section=info.name==='runtime-research-loop'?'health':info.params.get('section');if(section!=='all'&&!TAB_KEYS.has(section))section=card?'research':block?'runtime':'overview';return {section,card,block};}
function detailHref(strategyRef,section='overview',extra={}){return `#strategy-detail?strategy=${encodeURIComponent(strategyRef)}&section=${encodeURIComponent(section)}${extra.card?`&card=${encodeURIComponent(extra.card)}`:''}${extra.block?`&block=${encodeURIComponent(extra.block)}`:''}`;}
const linkHref=(strategyRef,link)=>detailHref(strategyRef,link.section,link);
function renderNavigation(model){const route=effectiveRoute();const current=route==='strategy-detail'?'strategies':route;$('nav').innerHTML=model.navigation.map((item)=>`<a href="#${esc(item.route)}" aria-current="${item.route===current?'page':'false'}">${esc(item.label)}</a>`).join('');}
function renderContext(model){const route=effectiveRoute();const detail=route==='strategy-detail';const data=route==='runtime-status';$('context-eyebrow').textContent=detail?'当前 Desk 策略':'当前查看范围';$('context-title').textContent=detail?model.context.title:(route==='strategies'?'Desk 系统策略目录':model.navigation.find((item)=>item.route===route)?.label||'Research 研究工作台');$('context-subtitle').textContent=detail?model.context.subtitle:(route==='strategies'?'运行、观察与历史分开；Research 关联不等于策略运行状态':model.safety_label);const picker=$('context-picker');if((detail||data)&&model.context.options.length){picker.innerHTML=`<label for="strategy-picker">切换 Desk 策略</label><select id="strategy-picker">${model.context.options.map((item)=>`<option value="${esc(item.strategy_ref)}" ${item.selected?'selected':''}>${esc(item.market_label)} / ${esc(item.strategy_label)}</option>`).join('')}</select>`;$('strategy-picker').addEventListener('change',(event)=>{location.hash=detail?detailHref(event.target.value,detailRoute().section):`#runtime-status?strategy=${encodeURIComponent(event.target.value)}`;});}else picker.innerHTML='';}
/** 策略卡上的研究进度：结论句在前，其下四行（体检与基线、方案对比、采用决定、待研究）；句子全部由读模型生成，页面只排版。 */
function researchStage(stage){return `<p class="research-line">Research：${esc(stage.headline_zh)}</p>${stage.steps.length?`<dl class="stage-steps">${stage.steps.map((step)=>`<dt>${esc(step.label_zh)}</dt><dd>${esc(step.text_zh)}</dd>`).join('')}</dl>`:''}`;}
function strategyCard(item){return `<a class="strategy-card" href="${detailHref(item.strategy_ref)}"><span class="market-label">${esc(item.market_label)}</span><h3>${esc(item.name)}</h3><div class="status-row">${pill(item.lifecycle.label,item.lifecycle.code)}${pill(item.mode_label,item.role==='SHADOW'?'OBSERVING':'')}</div>${researchStage(item.research_stage)}<span class="open-label">查看完整策略详情 →</span></a>`;}
function renderOverview(model){const view=model.views.strategies;if(model.strategy_directory.state!=='AVAILABLE')return `${answerPanel(view)}<section class="error-state" role="alert"><h2>Desk 策略目录暂时不可读取</h2><p>页面没有退回内部实验或样例数据。请检查本地 Desk 只读源后重试。</p><button type="button" class="retry">重试</button></section>`;const current=model.strategy_directory.current;const history=model.strategy_directory.history;return `${answerPanel(view)}<section class="section" aria-labelledby="current-title"><div class="section-head"><h2 id="current-title">运行与观察</h2><p>${current.length} 项 · 生命周期来自 Desk</p></div><div class="strategy-grid">${current.map(strategyCard).join('')}</div></section><section class="section" aria-labelledby="history-title"><div class="section-head"><h2 id="history-title">历史与收尾</h2><p>${history.length} 项 · 与当前运行分开</p></div><div class="strategy-grid">${history.map(strategyCard).join('')}</div></section>`;}
function sectionNav(strategyRef,current){return `<nav class="section-nav" aria-label="策略详情页签">${DETAIL_TABS.map(([key,label])=>`<a href="${detailHref(strategyRef,key)}"${key===current?' aria-current="page"':''}>${label}</a>`).join('')}<a class="expand-all" href="${detailHref(strategyRef,'all')}"${current==='all'?' aria-current="page"':''}>全部展开</a></nav>`;}
/**
 * 折叠开关：页签之内的结构折叠（对比卡、卡内分块、附属卡）写在 data-fold="open|closed" 上，收起时只留标题行（CSS 隐藏其余子元素）；
 * 与 <details> 技术折叠分开——代号替换与「主内容」只按 <details> 算，原来的标记不加包裹层。
 */
const foldAttr=(open)=>` data-fold="${open?'open':'closed'}"`;
const foldToggle=(label,open)=>`<button type="button" class="fold-toggle" aria-expanded="${open?'true':'false'}">${label}</button>`;
function linkCard(item,title){return `<article class="card"><div class="fact-head"><h3>${esc(title)}</h3>${pill(item.conclusion_label,item.conclusion)}</div><dl>${item.strategy_name?`<dt>策略</dt><dd>${esc(item.strategy_name)}</dd>`:''}<dt>问题</dt><dd>${esc(item.question_label)}</dd>${item.desk_source_zh?`<dt>来源</dt><dd>${esc(item.desk_source_zh)}</dd>`:''}${item.desk_state_zh?`<dt>Desk 状态</dt><dd>${esc(item.desk_state_zh)}</dd>`:''}<dt>证据冻结</dt><dd>${item.has_frozen_experiment?'已冻结':'尚未冻结'}</dd><dt>锁定结果</dt><dd>${item.has_locked_result?'已有锁定结果':'尚无锁定结果'}</dd><dt>Desk 决定</dt><dd>${esc(item.adoption_label)}</dd></dl>${tech(item.technical)}</article>`;}
/** 金额按所选策略档案的币种写；投影没带币种（美元档案）时按美元。USDT 这类非 ISO 币种写「数字 币种」。 */
let MONEY='USD';
const usd=(value,digits=2)=>Number.isFinite(value)?(/^[A-Z]{3}$/.test(MONEY)?new Intl.NumberFormat('zh-CN',{style:'currency',currency:MONEY,minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value):`${new Intl.NumberFormat('zh-CN',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value)} ${MONEY}`):'未知';
const fixed=(value,digits=6)=>Number.isFinite(value)?Number(value).toFixed(digits):'未知';
const pct=(value,digits=1)=>Number.isFinite(value)?`${(value*100).toFixed(digits)}%`:'未知';
const pctM=(value,digits=1)=>Number.isFinite(value)?`${value<0?'−':''}${(Math.abs(value)*100).toFixed(digits)}%`:'未知';
/** R 值的小数位按所选策略档案（增补 1 §1.4：C17 三位）；投影没带时两位。 */
let R_DIGITS=2;
const rVal=(value)=>Number.isFinite(value)?`${value<0?'−':'+'}${Math.abs(value).toFixed(R_DIGITS)} R`:'未知';
/** US_CORE_Q0_RESULT_V1：带正负号的一位小数百分比（G_GAP 的主数字与判据）、「数字 美元」整数写法（压力与半凯利的正文）。 */
const pctS=(value)=>Number.isFinite(value)?`${value<0?'−':'+'}${(Math.abs(value)*100).toFixed(1)}%`:'未知';
const usdWord=(value)=>Number.isFinite(value)?`${Math.round(value).toLocaleString('en-US')} 美元`:'未知';
const metricVal=(unit,value)=>unit==='pct_signed'?pctS(value):rVal(value);
const num=(value,digits=2)=>Number.isFinite(value)?Number(value).toFixed(digits):'未知';
const yesNo=(value)=>value===true?'已恢复':value===false?'未恢复':'未知';
const notBacktested=(reason)=>`<p class="not-backtested">尚未回测：${esc(reason||'原因未提供')}</p>`;
/** 列头可以是字符串，或 {label, title}（悬停提示，修订 5 E3）。 */
const th=(item)=>item&&typeof item==='object'?`<th scope="col" title="${esc(item.title)}">${esc(item.label)}</th>`:`<th scope="col">${esc(item)}</th>`;
const table=(head,rows,caption)=>`<div class="table-wrap"><table>${caption?`<caption>${esc(caption)}</caption>`:''}<thead><tr>${head.map(th).join('')}</tr></thead><tbody>${rows.map((row)=>`<tr>${row.map((cell)=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
/**
 * 修订 5 勘误 1 E3：「期末是否回到最高点」——对比的是区间内到过的最高权益，不是起始本金（列头悬停提示，加首次出现处的脚注）。
 * 「未恢复」的格子里补距最高点的幅度、最高点日期与之后的交易日数；这些读数由服务端从封存的权益序列取出，页面只显示。
 */
const RECOVERED_LABEL='期末是否回到最高点';
const RECOVERED_NOTE='对比的是区间内到过的最高权益，不是起始本金。未恢复 = 期末仍低于此前最高点。';
const RECOVERED_HEAD={label:RECOVERED_LABEL,title:RECOVERED_NOTE};
const recoveredCell=(recovered,peak)=>`${yesNo(recovered)}${recovered===false&&peak?`<br><span class="muted-inline">距最高点 ${pctM(peak.gap,1)}；最高点在 ${esc(peak.date)}，已过去 ${esc(peak.sessions_since)} 个交易日</span>`:''}`;
/** 修订 5 E6：每个结论块里第一次出现「证据不足」的那一段之后，加一行固定说明（只加一次；折叠的技术详情不算）。 */
const INSUFFICIENT_NOTE='证据不足 = 95% 区间跨过了事先冻结的门槛，既不能说更好也不能说更差；不等于否定。常见原因是样本太少，或者改动只影响少数交易。';
const withInsufficientNote=(parts)=>{const at=parts.findIndex((part)=>part&&!part.startsWith('<details')&&part.includes('证据不足'));return (at<0?parts:[...parts.slice(0,at+1),`<p class="insufficient-note">${INSUFFICIENT_NOTE}</p>`,...parts.slice(at+1)]).join('');};
/**
 * 修订 5 E7.2：策略详情页主内容（<details> 之外）里的内部代号（如 T3、X1）换成中文题名，代号只留在折叠的技术详情里。
 * 只改文字，不动标签和属性；对照表来自说明登记（view.code_names）。
 */
function plainCodes(html,names){
  const codes=Object.keys(names||{});if(!codes.length)return html;
  // 代号与中文之间的半角空格随代号去掉（「候选 T3：」→「候选「…」：」）；挨着英文、数字或其他符号的空格保留
  const re=new RegExp(`(^|[^A-Za-z0-9_])( ?)(${codes.join('|')})(?![A-Za-z0-9_])( ?)`,'g');
  const cjk=(char)=>/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/.test(char);
  let depth=0;
  return html.split(/(<[^>]*>)/).map((part)=>{
    if(part.startsWith('<')){if(/^<details[\s>]/.test(part))depth+=1;else if(part==='</details>')depth-=1;return part;}
    return depth?part:part.replace(re,(match,lead,before,code,after,at,text)=>`${lead}${before&&!cjk(lead)?' ':''}「${esc(names[code])}」${after&&!cjk(text.charAt(at+match.length))?' ':''}`);
  }).join('');
}
const CONCLUSION_TONE={SUPPORTED:'ok',NOT_PASSED:'bad',INSUFFICIENT:'warn',NOT_BACKTESTED:''};
function renderConclusion(c){
  const main=c.main_number
    ?`<p class="main-number"><strong>${esc(c.main_number.label)}：${metricVal(c.main_number.unit,c.main_number.value)}</strong><span>（95% 区间 ${metricVal(c.main_number.unit,c.main_number.ci.lo)} 至 ${metricVal(c.main_number.unit,c.main_number.ci.hi)}）</span></p>${c.main_number_note_zh?`<p class="main-number-note">${esc(c.main_number_note_zh)}</p>`:''}`
    :`<p class="main-number"><strong>主数字：尚无</strong>${c.state==='NOT_BACKTESTED'?'':`<span>（${esc(c.main_number_missing_zh||'结果文件缺样本外 5 bps 生产相位一行')}）</span>`}</p>`;
  const basis=renderBasis(c.basis);
  // US_CORE §6.2：风控高亮（只报不判，不进结论）放在判定依据下面，不折叠
  const highlights=(c.highlights||[]).map((h)=>h.valid?`<div class="risk-highlight" id="bt-highlight-${esc(h.key)}" data-highlight="${esc(h.key)}"><p><strong>${esc(h.lead_zh)}</strong>：${esc(h.text_zh)}</p>${h.gap_zh?`<p class="muted-note">${esc(h.gap_zh)}</p>`:''}</div>`:`<p class="muted-note">${esc(h.text_zh)}</p>`).join('');
  const body=withInsufficientNote([`<p class="eyebrow">回测结论</p><h2 id="conclusion-title">${esc(c.label)}${c.state==='NOT_BACKTESTED'?`：${esc(c.reason)}`:''}</h2>${c.engine_line_zh?`<p class="engine-line">${esc(c.engine_line_zh)}</p>`:''}`,main,(c.supplementary_lines_zh||[]).map((line)=>`<p class="supplementary-line">${esc(line)}</p>`).join(''),basis,highlights,`<p class="biggest-limit"><strong>${esc(c.limit_label||'最大的限制')}：</strong>${esc(c.biggest_limit)}</p>`,renderCompleteness(c.completeness),c.edge_line_zh?`<ul class="edge-line"><li>${esc(c.edge_line_zh)}</li></ul>`:'']);
  return `<section class="conclusion ${CONCLUSION_TONE[c.state]||''}" data-state="${esc(c.state)}" aria-labelledby="conclusion-title">${body}</section>`;
}
/** D1：判定依据——触发本结论的那条判据（指标、比较对象、区间、门槛），另一条判据的数字并列在后。 */
const renderBasis=(basis)=>basis&&basis.main&&basis.main.length?`<p class="basis"><strong>${esc(basis.title)}：</strong>${basis.main.map(esc).join('；')}（${esc(basis.frozen_zh)}）</p>${basis.also.length?`<ul class="basis-also">${basis.also.map((text)=>`<li>同时：${esc(text)}</li>`).join('')}</ul>`:''}${basis.know_zh&&basis.know_zh.length?`<ul class="basis-also">${basis.know_zh.map((text)=>`<li>另须知道：${esc(text)}</li>`).join('')}</ul>`:''}`:'';
/** 三行（优势结论／压力评价／采用条件）：顶部结论区块一次，每张对比卡的结论块一次；回测结论卡第 6 块不再重复。 */
const renderCompleteness=(c)=>c&&!c.complete?`<ul class="completeness" aria-label="优势结论、压力评价与采用条件分开列出"><li>${esc(c.edge_line)}</li><li class="warn">${esc(c.stress_line)}</li><li class="bad">${esc(c.adoption_line)}</li></ul>`:'';
/**
 * 修订 5 E1：半凯利块的结论行之前写出算式和代入的下沿。p、b、f* 都是结果文件里的数（p_ci.lo、b_ci.lo、f_star），只做格式化，不另算。
 */
function kellyFormula(d){
  const tail=d.f_star<=0?'f* ≤ 0 → 半凯利 = 0：长期看下注越多亏得越多，不支持按凯利加仓'
    :d.supported?`f* > 0 → 半凯利 = ${pct(d.f_half,1)}（结果文件的半凯利比例）`:`f* > 0，但结果文件的半凯利比例为 0${d.rule_zh?`（${esc(d.rule_zh)}）`:''}`;
  const source=d.source_row?`这里的 p、b 与上面「胜率与赔率」表${esc(d.source_row.segment_label)}、${esc(d.source_row.phase_label)}、${d.source_row.cost_label!==undefined?esc(d.source_row.cost_label):`基础成本（${esc(d.source_row.cost_bps)} bps）`}那一行相同。`
    :'这里的 p、b 取自结果文件的半凯利字段；它们与「胜率与赔率」表样本外、生产相位、基础成本那一行对不上，以结果文件为准。';
  return `<div class="kelly-formula"><p>凯利比例 f* = p − (1 − p) ÷ b，p 为样本外胜率，b 为赔率。</p><p>按保守下沿 p = ${pct(d.p_ci.lo,1)}、b = ${num(d.b_ci.lo)}，f* = ${pctM(d.f_star,1)}。</p><p><strong>${tail}</strong></p><p class="muted-note">${source}</p></div>`;
}

function formulaGrid(cells,caption='每格是每笔的期望增长'){const rates=[...new Set(cells.map((c)=>c.win_rate))].sort((x,y)=>x-y);const payoffs=[...new Set(cells.map((c)=>c.payoff))].sort((x,y)=>x-y);const at=(rate,payoff)=>cells.find((c)=>c.win_rate===rate&&c.payoff===payoff);return table(['假设胜率 ＼ 假设赔率',...payoffs.map((p)=>num(p))],rates.map((rate)=>[pct(rate,0),...payoffs.map((payoff)=>{const cell=at(rate,payoff);return cell?pct(cell.expected_growth,2):'—';})]),caption);}

/** US_CORE §5：压力表（美元整数，另列回撤）；最大损失后紧跟该行回撤；中文场景名的英文原文进技术详情。 */

><span>佣金</span><span>${usd(c.commission.total,2)}</span><strong>合计</strong><strong>${usd(c.total,6)}</strong></div><p>${esc(c.allocation_limit)}</p><p>滑点 ${usd(decision.slippage.amount,2)} 已包含在成交价中，没有重复扣减。</p></article></div></details></section><section class="section"><div class="section-head"><h3>这段实际运行能说什么，不能说什么</h3></div><article class="card"><ul class="limit-list">${d.limitations.map((item)=>`<li>${esc(item)}</li>`).join('')}</ul><div class="status-row">${pill('生产影响：无','VALID')}${pill('下单：禁止','VALID')}</div></article></section>${renderStateDetails(d,health)}</div>`;

/**

function renderNotOnboarded(view){return `<a class="breadcrumb" href="#strategies">← 返回策略总览</a><section class="empty-state not-onboarded" role="status" aria-labelledby="not-onboarded-title"><h3 id="not-onboarded-title">${esc(view.profile_label)}</h3><p>该对象不在当前 Desk 权威目录中，页面不会根据 URL 伪造详情。</p></section>`;}
/**
 * 修订 7 J1：「总览」页签——一句话结论（服务端模板）、关键数字卡、研究结论与采用一览（精简）、现在生效的规则与待办。
 * 数字和文字都来自投影 view.summary（锁定结果与采用记录），页面只格式化；每张卡、每一行、每个待办都链到对应细节。

const TILE_VALUE={
  end_capital:(t)=>[usd(t.own,0),t.comparator==null?'':`${esc(t.comparator_label)} ${usd(t.comparator,0)}；${esc(t.window.start)} 至 ${esc(t.window.end)}`],
  max_drawdown:(t)=>[pct(t.own),t.comparator==null?'':`${esc(t.comparator_label)} ${pct(t.comparator)}`],
  winrate:(t)=>[`${pct(t.win_rate)} · ${t.payoff===null?`无亏损${t.unit_zh||'笔'}`:num(t.payoff)}`,`胜率 · 赔率；${esc(t.row_zh)}，${esc(t.n)} ${esc(t.unit_zh||'笔')}`],
  half_kelly:(t)=>t.not_applicable?['不适用',`权益曾低于 ${Number(t.floor).toLocaleString('en-US')} 的概率 ${pct(t.p_below_floor)}`]:[pct(t.f_half,1),t.supported?'按区间下沿计算':'不支持按凯利加仓（区间下沿为 0）'],
  rule1b:(t)=>[usd(t.own,0),`对现行 ${usd(t.baseline,0)}；停止日 ${esc(t.halt_session)}${t.gap_short_zh?`<br>${esc(t.gap_short_zh)}`:''}`],
  adoption_rate:(t)=>[t.rate==null?'—':pct(t.rate,0),`采用 ${esc(t.adopted)} ÷ 已决定 ${esc(t.decided)}；待决定 ${esc(t.pending)} 题`],
  underwater:(t)=>[`${esc(t.sessions)} 个 session`,`${yesNo(t.recovered)}${t.recovered===false&&t.peak?`，距最高点 ${pctM(t.peak.gap,1)}（最高点 ${esc(t.peak.date)}）`:''}`],
};
function summaryTile(t,ref){const [value,detail]=(TILE_VALUE[t.key]||(()=>['—','']))(t);return `<a class="tile" data-tile="${esc(t.key)}" href="${linkHref(ref,t.link)}"><small>${esc(t.label_zh)}</small><strong class="value">${value}</strong>${detail?`<small>${detail}</small>`:''}</a>`;}
function summaryAdoption(a,ref){
  if(!a)return '';

  const rows=a.groups.map((group)=>`${group.rows.map((r)=>`<tr><td><a href="${linkHref(ref,r.link)}"><strong>${esc(r.question_ref)}</strong> ${esc(r.title_zh)}</a></td><td>${capital(r)}</td><td>${esc(r.verdict_label)}</td><td>${r.decision_zh==='采用'?`<strong>${esc(r.decision_zh)}</strong>`:esc(r.decision_zh)}</td></tr>`).join('')}`).join('');
  return `<div class="summary-adoption"><h3>${esc(a.title_zh)}</h3><div class="table-wrap"><table class="compact-table"><thead><tr><th scope="col">题号与中文题名</th><th scope="col">样本外期末差值（候选 − 原版）</th><th scope="col">统计结论</th><th scope="col">采用决定</th></tr></thead><tbody>${rows}</tbody></table></div><p class="adoption-summary">${a.cumulative_zh?`累计：${esc(a.cumulative_zh)}`:esc(a.groups[a.groups.length-1].summary_zh)}</p>${a.banner_zh?`<p class="deviation-banner" role="status">${esc(a.banner_zh)}</p>`:''}</div>`;
}
function summaryRules(r,ref){

function renderSummaryTab(view,ref){

  if(!s)return `<section class="section detail-section" id="detail-overview">${head}${renderConclusion(view.conclusion)}</section>`;
  return `<section class="section detail-section" id="detail-overview">${head}<div class="summary-panel ${CONCLUSION_TONE[s.state]||''}" data-state="${esc(s.state)}"><p class="eyebrow">一句话结论</p><p class="summary-sentence">${esc(s.sentence_zh)}</p></div>${s.tiles.length?`<div class="tiles">${s.tiles.map((t)=>summaryTile(t,ref)).join('')}</div>`:''}${summaryAdoption(s.adoption,ref)}${summaryRules(s.rules,ref)}</section>`;
}
/** 修订 7 J4.3：各对比题的前向行集中在「前向观察」页签，按题分组；对比卡里只留一行。 */

}

}
function renderResearch(model){const view=model.views.experiments;const comparisons=model.views.races;return `${answerPanel(view)}<section class="section" id="research-questions"><div class="section-head"><h2>真实研究问题</h2><p>跨策略队列</p></div>${view.items.length?view.items.map((item)=>linkCard(item,'研究问题')).join(''):emptyState('研究队列为空','这里不会用平台工程实验替代 Desk 的真实问题。先由 Desk 复盘形成明确问题，再按原研究槽顺序接入。')}</section><section class="section" id="research-comparison"><div class="section-head"><h2>锁定方案对比</h2><p>原版、候选与适当基准</p></div>${comparisons.items.length?comparisons.items.map((item)=>linkCard(item,'方案对比')).join(''):emptyState('还没有锁定对比结果','当前首案的原生扫描、基准行情与完整净成本尚未齐全，不能提前给出胜负。')}</section>`;}
function renderShadow(model){const view=model.views.shadow;return `${answerPanel(view)}${view.hk_items.length?`<section class="section"><div class="section-head"><h2>已在 HK 运行</h2><p>登记的运行位置与起始日；导入 QRP 前不放结果数字</p></div><div class="grid two">${view.hk_items.map(renderHkItem).join('')}</div></section>`:''}${view.items.length?`<section class="section"><div class="section-head"><h2>QRP 已导入</h2></div><div class="grid two">${view.items.map((item)=>`<article class="card"><h3>${esc(item.state_label)}</h3><p>${esc(item.sample_label)}</p><div class="status-row">${pill(item.claim_label,item.claim_label.includes('达到')?'VALID':'DEGRADED')}</div>${tech(item.technical)}</article>`).join('')}</div></section>`:(view.hk_items.length?'':emptyState('还没有真实前向观察','工程 shadow 样例不会显示为 Desk 策略的前向证据。'))}`;}
function renderPromotion(model){const view=model.views.promotion;return `${answerPanel(view)}${view.items.length?`<section class="section">${view.items.map((item)=>linkCard(item,'Desk 往返与采用')).join('')}</section>`:emptyState('还没有完成真实往返','当前没有可回到 Desk 的锁定研究结论；未实现的采用能力不会被写成“未采用”。')}<section class="section"><div class="section-head"><h2>用户决定与系统结论分开</h2><p>${esc(view.production_effect_label)}</p></div><div class="safety-grid"><div class="safety-item">Research 不能下单</div><div class="safety-item">系统不能代替用户采用</div><div class="safety-item">不写生产参数</div></div></section>${authorityDisclosure(model)}`;}
function renderRuntime(model){const view=model.views['runtime-status'];return `${answerPanel(view)}<section class="section"><div class="section-head"><h2>所选策略的实际输入</h2><p>${view.sources.length} 个已登记文件</p></div>${view.sources.length?`<div class="grid">${view.sources.map((source)=>`<article class="card"><h3>${esc(source.label)}</h3><p>${esc(source.file_name)}</p><div class="status-row">${pill(source.state_label,'CONNECTED')}</div>${tech([source.technical],'查看原始路径')}</article>`).join('')}</div>`:emptyState('没有已登记的 QRP 实际输入','Desk 策略已登记不等于 Research 输入已接入；未登记也不等于数值为 0。')}</section>${view.blockers.length?`<section class="section"><div class="section-head"><h2>数据缺口</h2><p>影响完整回放与净核算</p></div>${view.blockers.map((item)=>`<article class="card blocker"><h3>${esc(item.label)}</h3><p>${esc(item.impact)}</p></article>`).join('')}</section>`:''}<section class="section"><div class="grid two"><article class="card"><h3>运行状态来源</h3><p>${esc(view.runtime_binding_label)}</p></article><article class="card"><h3>Research 隔离</h3><p>${esc(view.isolation.label)}</p><div class="status-row">${pill('下单：禁止','VALID')}${pill('激活：禁止','VALID')}${pill('写运行态：禁止','VALID')}</div></article></div></section><section class="section"><div class="section-head"><h2>V8.1 产品阶段证据</h2><p>工程通过不等于产品交付</p></div><div class="milestones">${view.milestones.map((stage)=>`<article class="milestone"><strong>${esc(stage.stage)} · ${esc(stage.label)}</strong>${pill(stage.state_label,stage.state)}<small>${esc(stage.environment_label)}</small>${stage.user_result?`<p>${esc(stage.user_result)}</p>`:''}</article>`).join('')}</div>${view.m4_scope?renderM4Scope(view.m4_scope):''}</section>${productEvidenceDisclosure(model)}${deskSourceDisclosure(model)}${engineeringDisclosure(model.engineering_samples)}`;}
/** 修订 4：平台级 M4 一行、M5 一行、未立项的方向，以及 A4.2 五条策略各自的状态（没有接入的不给阶段零值）。 */
function renderM4Scope(m){return `<div class="m4-scope"><h3>${esc(m.title)}</h3><div class="status-row">${pill(`平台级 M4：${m.state_label}`,m.state)}${pill(`M5：${m.m5_state_label}`,m.m5_state)}${m.other_directions.map((item)=>pill(`${item.label}：${item.state_label}`,'')).join('')}</div><p class="muted-note">${esc(m.rule_label)}${esc(m.first_case_label)}。</p><ul class="m4-items">${m.items.map((item)=>`<li><strong>第 ${esc(item.batch)} 批 · ${esc(item.label)}</strong>（${esc(item.currency)}）：${esc(item.state_label)}${item.identity_note?`<br><span class="muted-inline">${esc(item.identity_note)}</span>`:''}${item.stages?`<br><span class="muted-inline">${item.stages.map((stage)=>`${esc(stage.stage)} ${esc(stage.state_label)}`).join(' · ')}；M4 范围项 ${esc(item.m4_state_label)}</span>`:''}</li>`).join('')}</ul></div>`;}
function engineeringDisclosure(samples){return `<details class="engineering-samples"><summary>平台工程与历史样例（不属于 Desk 当前策略）</summary><div class="detail-body"><p><strong>${esc(samples.notice)}</strong></p><ul>${samples.groups.map((group)=>`<li>${esc(group.label)}：${group.count} 个${group.technical_ids.length?`<details><summary>查看内部 ID</summary><div class="detail-body"><ul>${group.technical_ids.map((id)=>`<li><code>${esc(id||'MISSING')}</code></li>`).join('')}</ul></div></details>`:''}</li>`).join('')}</ul><p>原始只读接口：${samples.raw_readonly_endpoints.map((endpoint)=>`<code>${esc(endpoint)}</code>`).join(' · ')}</p></div></details>`;}
function productEvidenceDisclosure(model){const t=model.technical;const health=model.views['strategy-detail'].health;const diagnostic=health.diagnostic;const stage=health.product_stage;return `<details><summary>V8.1 产品里程碑真相（技术详情）</summary><div class="detail-body"><p>冻结验收、版本化修订、实际证据门禁和完成权威共同决定阶段；页面存在或测试通过不会把 <code>NOT_VERIFIED</code> 变成已交付。</p><dl><dt>冻结验收</dt><dd><code>${esc(t.product_acceptance_ref)}</code></dd><dt>版本化修订</dt><dd><code>${esc((t.product_acceptance_amendment_refs||[]).join(' · '))}</code></dd><dt>实际证据门禁</dt><dd>必须绑定同一 case 的真实用户任务与文件哈希证据</dd><dt>完成权威</dt><dd><code>${esc(t.completion_authority)}</code></dd><dt>实际入口</dt><dd><code>/#strategy-detail?strategy=${esc(encodeURIComponent(model.context.selected_strategy_ref||''))}&amp;section=health</code></dd><dt>M1 阶段</dt><dd>${esc(stage?.state_label||'尚未验证')}</dd><dt>交付环境</dt><dd>${esc(stage?.environment_label||'尚无环境证据')}</dd><dt>用户结果</dt><dd>${diagnostic?.state==='VERIFIED'?'可追踪 MSFU 决策并核对现金、持仓、费用和 Research 净结果':'尚不能完成本案完整体检任务'}</dd><dt>诊断能力</dt><dd>${diagnostic?.state==='VERIFIED'?'同窗原生回放、决策链与净账户对账已通过内容校验':'尚未取得可用的 sealed 诊断输入'}</dd><dt>限制/异常</dt><dd>${diagnostic?.state==='VERIFIED'?'12-session 样本不足（要求 20）；监管费为 stand-alone 研究模型':'按页面当前缺口为准；未知不得填 0'}</dd></dl></div></details>`;}
function deskSourceDisclosure(model){const p=model.technical.desk_directory_provenance;return `<details><summary>查看 Desk 策略目录来源</summary><div class="detail-body">${p?`<p>策略范围、生命周期与名称来自同一组 Desk 只读模块。</p><ul>${p.files.map((item)=>`<li><code>${esc(item.file)}</code><br />SHA-256：<code>${esc(item.sha256)}</code></li>`).join('')}</ul>`:`<p>目录来源不可用：<code>${esc(model.technical.desk_directory_error||'UNKNOWN')}</code></p>`}</div></details>`;}
function authorityDisclosure(model){return `<details><summary>查看四方权威边界</summary><div class="detail-body"><ul><li>${esc(model.authority.runtime)}</li><li>${esc(model.authority.research)}</li><li>${esc(model.authority.review_and_adoption)}</li><li>${esc(model.authority.cycle)}</li></ul></div></details>`;}
const renderers={strategies:renderOverview,'strategy-detail':renderDetail,experiments:renderResearch,shadow:renderShadow,promotion:renderPromotion,'runtime-status':renderRuntime};
let loadedStrategyRef=null;let lastModel=null;
function requestedStrategy(){return routeInfo().params.get('strategy');}
/** 定位：card= 到那张对比卡，block= 到回测结论卡那一块，其他页签到页签开头；总览与全部展开不滚动。 */
function scrollToSection(){if(effectiveRoute()!=='strategy-detail')return;const {section,card,block}=detailRoute();const id=card?`card-${card}`:block?`bt-${block}`:(section!=='overview'&&section!=='all'?`detail-${section}`:null);if(id)requestAnimationFrame(()=>document.getElementById(id)?.scrollIntoView({block:'start'}));}
function render(model){lastModel=model;MONEY=model.views['strategy-detail']?.currency||'USD';R_DIGITS=model.views['strategy-detail']?.r_digits||2;renderContext(model);renderNavigation(model);const route=effectiveRoute();$('workspace').innerHTML=renderers[route](model);const label=route==='strategy-detail'?'策略详情':model.navigation.find((item)=>item.route===route)?.label||'Research 研究工作台';document.title=`${label} · Research 研究工作台`;$('workspace').querySelector('.retry')?.addEventListener('click',()=>load(loadedStrategyRef));scrollToSection();}
async function load(strategyRef=requestedStrategy()||loadedStrategyRef){const workspace=$('workspace');workspace.innerHTML='<div class="loading" role="status">正在读取 Desk 策略目录与研究关联…</div>';try{const query=strategyRef?`?strategy_ref=${encodeURIComponent(strategyRef)}`:'';const response=await fetch(`/api/workspace${query}`,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`服务返回 ${response.status}`);const model=await response.json();if(model.error)throw new Error(model.error);loadedStrategyRef=model.context.selected_strategy_ref;render(model);}catch(error){workspace.innerHTML=`<section class="error-state" role="alert"><h2>暂时无法读取 Research 数据</h2><p>${esc(error.message)}</p><button type="button" class="retry">重试</button></section>`;workspace.querySelector('.retry').addEventListener('click',()=>load(strategyRef));}}
window.addEventListener('hashchange',()=>{const info=routeInfo();if(!KNOWN_ROUTES.has(info.name)){location.hash='strategies';return;}if(info.name==='runtime-research-loop'){const canonical=lastModel?.context.canonical_current_strategy_ref;if(canonical&&canonical!==loadedStrategyRef){load(canonical);return;}}const wanted=requestedStrategy();if(wanted&&wanted!==loadedStrategyRef)load(wanted);else if(lastModel){render(lastModel);$('workspace').focus({preventScroll:true});}});
/** 结构折叠的开合（事件委托）；对比卡展开时把 card= 写进地址（不重新渲染），收起时去掉，链接可以直接分享。 */
$('workspace').addEventListener('click',(event)=>{
  const button=event.target&&event.target.closest?event.target.closest('.fold-toggle'):null;const fold=button&&button.closest('[data-fold]');if(!fold)return;
  const open=fold.dataset.fold!=='open';fold.dataset.fold=open?'open':'closed';button.setAttribute('aria-expanded',open?'true':'false');
  if(fold.dataset.card&&effectiveRoute()==='strategy-detail'){const info=routeInfo();const params=new URLSearchParams(info.params);if(open)params.set('card',fold.dataset.card);else if(params.get('card')===fold.dataset.card)params.delete('card');history.replaceState(null,'',`#${info.name}?${params.toString()}`);}
});
load();
</script>
