<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research 研究工作台</title>
<style>
  :root{color-scheme:light;--page:#f4f6f8;--surface:#fff;--soft:#f8fafb;--ink:#16232c;--muted:#61717d;--line:#dce3e7;--line2:#c7d2d9;--brand:#0c6774;--brand2:#e7f4f5;--ok:#256a47;--ok2:#e9f5ee;--warn:#8a5a16;--warn2:#fff4dd;--bad:#9b3b36;--bad2:#fbeceb;--info:#315d8c;--info2:#eaf2fb;--shadow:0 1px 2px rgba(23,35,44,.04),0 8px 24px rgba(23,35,44,.04);--radius:12px}
  *{box-sizing:border-box}html{background:var(--page);scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}button,select{font:inherit}a{color:inherit}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #7dc5cd;outline-offset:2px}.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;z-index:20}.skip:focus{left:12px}
  .app-head{background:#0e2830;color:#fff;padding:17px max(20px,calc((100vw - 1240px)/2));border-bottom:1px solid #21434b}.brand-row,.context-row,.section-head,.fact-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#d9f0f0;color:#0e5964;font-weight:800}.brand h1{font-size:17px;line-height:1.25;margin:0}.brand p{font-size:12px;color:#b7c9ce;margin:2px 0 0}.read-only{display:inline-flex;align-items:center;gap:7px;color:#d9ecee;border:1px solid #3c6168;border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap}.read-only::before{content:"";width:7px;height:7px;border-radius:50%;background:#72d1b1}
  .context-shell{background:var(--surface);border-bottom:1px solid var(--line)}.context-row{max-width:1240px;margin:auto;padding:20px;align-items:flex-end}.eyebrow{margin:0 0 4px;color:var(--brand);font-size:12px;font-weight:750;letter-spacing:.06em}.context-copy{min-width:0}.context-copy h2{font-size:23px;line-height:1.32;margin:0;letter-spacing:-.02em;overflow-wrap:anywhere}.context-copy p{color:var(--muted);margin:5px 0 0}.context-select label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.context-select select{max-width:390px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);padding:8px 32px 8px 10px}
  .tab-shell{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}nav{max-width:1240px;margin:auto;padding:9px 20px;display:flex;gap:6px;flex-wrap:wrap}nav a{text-decoration:none;color:var(--muted);padding:8px 11px;border-radius:8px;font-size:14px;font-weight:650}nav a:hover{background:var(--soft);color:var(--ink)}nav a[aria-current="page"]{background:var(--brand2);color:var(--brand)}
  main{max-width:1240px;margin:auto;padding:24px 20px 56px}.loading,.error-state,.empty-state{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px 26px;text-align:center;box-shadow:var(--shadow)}.loading{color:var(--muted)}.loading::before{content:"";display:block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error-state h2,.empty-state h3{margin:0 0 6px;font-size:18px}.error-state p,.empty-state p{margin:0 auto;color:var(--muted);max-width:720px}.retry{margin-top:16px;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:9px 15px;cursor:pointer;font-weight:650}
  .answer-panel{position:relative;overflow:hidden;background:linear-gradient(135deg,#f1f9f8 0,#fff 74%);border:1px solid #cfe4e5;border-radius:14px;padding:21px 24px;margin-bottom:20px;box-shadow:var(--shadow)}.answer-panel::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-86px;top:-105px;background:#d7eeed;opacity:.5}.answer-panel h2{position:relative;margin:0;font-size:19px;line-height:1.45;max-width:920px}.answer-panel .answer{position:relative;margin:9px 0 0;font-size:16px;max-width:940px}.answer-panel .next{position:relative;margin:11px 0 0;color:var(--brand);font-weight:650}
  .status-row{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 0}.pill{display:inline-flex;align-items:center;min-height:27px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--soft);color:var(--muted)}.pill.ok{border-color:#badbc9;background:var(--ok2);color:var(--ok)}.pill.warn{border-color:#ebd39d;background:var(--warn2);color:var(--warn)}.pill.bad{border-color:#edc3c0;background:var(--bad2);color:var(--bad)}.pill.info{border-color:#c8daed;background:var(--info2);color:var(--info)}
  .section{margin:26px 0}.section-head{align-items:baseline;margin-bottom:11px}.section-head h2{font-size:18px;margin:0}.section-head p{font-size:13px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.card h3{font-size:16px;line-height:1.45;margin:0}.card p{margin:8px 0 0;color:var(--muted)}.card.connected{border-top:3px solid var(--brand)}
  .strategy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.strategy-card{display:flex;min-width:0;min-height:198px;flex-direction:column;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s}.strategy-card:hover{border-color:#91bbc0;transform:translateY(-1px);box-shadow:0 10px 28px rgba(23,35,44,.09)}.strategy-card h3{font-size:16px;line-height:1.45;margin:11px 0 0;overflow-wrap:anywhere}.strategy-card .status-row{margin-top:auto;padding-top:14px}.strategy-card .research-line{color:var(--muted);font-size:13px;margin:10px 0 0}.strategy-card .open-label{color:var(--brand);font-weight:700;font-size:13px;margin-top:12px}.market-label{align-self:flex-start;color:var(--brand);font-size:12px;font-weight:750;letter-spacing:.05em}
  .detail-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:15px}.breadcrumb{display:inline-flex;color:var(--brand);text-decoration:none;font-size:13px;font-weight:650;margin-bottom:6px}.detail-top h2{font-size:26px;line-height:1.3;margin:0}.detail-top p{color:var(--muted);margin:7px 0 0}.section-nav{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:20px}.section-nav a{text-decoration:none;color:var(--muted);font-size:13px;font-weight:650;padding:7px 9px;border-radius:7px}.section-nav a:hover{background:var(--brand2);color:var(--brand)}.detail-section{scroll-margin-top:76px}.detail-section>.card,.detail-section>.grid{margin-top:10px}
  .fact-list{list-style:none;padding:0;margin:0}.fact-list li{padding:11px 0;border-bottom:1px solid var(--line)}.fact-list li:last-child{border-bottom:0}.fact-head{align-items:baseline}.fact-head strong{font-size:14px}.fact-head span{font-size:12px;color:var(--muted)}.fact-list p{margin:4px 0 0;color:var(--muted);font-size:14px}.blocker{border-left:4px solid #c58b33}.blocker+.blocker{margin-top:10px}.blocker .impact{color:var(--ink)}.blocker .action{color:var(--brand)}
  dl{margin:12px 0 0;display:grid;grid-template-columns:minmax(110px,.55fr) minmax(0,1fr);gap:7px 16px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.milestones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.milestone{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}.milestone strong{display:block;margin-bottom:5px}.milestone small{display:block;color:var(--muted);margin-top:5px}
  details{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:14px}summary{cursor:pointer;list-style:none;padding:13px 15px;color:var(--muted);font-size:13px;font-weight:650}summary::-webkit-details-marker{display:none}summary::before{content:"＋";display:inline-block;width:20px;color:var(--brand)}details[open] summary::before{content:"−"}.detail-body{border-top:1px solid var(--line);padding:14px 16px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.detail-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#36505e;word-break:break-all}.detail-body ul{margin:6px 0;padding-left:20px}.detail-body p{margin:5px 0}.safety-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.safety-item{background:var(--ok2);color:var(--ok);border-radius:8px;padding:12px;text-align:center;font-weight:650}
  .diagnostic{margin-top:16px}.diagnostic-hero{background:linear-gradient(135deg,#eaf6f2,#fff);border:1px solid #bfded2;border-radius:14px;padding:20px;box-shadow:var(--shadow)}.diagnostic-hero h3{font-size:20px;margin:2px 0 0}.diagnostic-hero p{color:var(--muted);margin:7px 0 0}.source-grid,.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.source-card,.metric{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:13px}.source-card strong,.metric strong{display:block}.source-card small,.metric small{display:block;color:var(--muted);margin-top:4px}.metric .value{font-size:20px;line-height:1.3;font-weight:760;color:var(--ink)}.timeline{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:9px}.timeline li{position:relative;border-left:3px solid #9ccfd0;background:var(--soft);border-radius:0 9px 9px 0;padding:12px 14px}.timeline time{display:block;color:var(--muted);font-size:12px}.timeline strong{display:block;margin:2px 0}.exception-card{border-left:4px solid #c58b33}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:620px;background:var(--surface)}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--soft);color:var(--muted);font-size:12px}tbody tr:last-child td{border-bottom:0}.cost-list{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 16px;margin-top:12px}.cost-list span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}.limit-list{margin:9px 0 0;padding-left:20px;color:var(--muted)}.truth-note{background:var(--warn2);border:1px solid #ebd39d;border-radius:10px;padding:12px 14px;margin-top:12px;color:#6c4b1e}.positive{color:var(--ok)}.negative{color:var(--bad)}
  @media(max-width:900px){.strategy-grid,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.milestones{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:680px){.grid,.grid.two,.strategy-grid,.source-grid,.metric-grid{grid-template-columns:1fr}.context-row{align-items:flex-start;flex-direction:column}.context-select,.context-select select{width:100%;max-width:none}.safety-grid{grid-template-columns:1fr}.tab-shell{position:static}.detail-top{flex-direction:column}.strategy-card{min-height:0}}
  @media(max-width:520px){.app-head{padding:14px 16px}.brand p{display:none}.read-only{font-size:11px;padding:5px 7px}.context-row{padding:17px 16px}.context-copy h2{font-size:20px}.context-copy p{font-size:13px}nav{padding:8px 12px;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px}nav a{text-align:left;font-size:13px;padding:8px;white-space:nowrap}main{padding:18px 14px 42px}.answer-panel{padding:18px}.answer-panel h2{font-size:17px}.answer-panel .answer{font-size:15px}.card,.strategy-card{padding:16px}.milestones{grid-template-columns:1fr}dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:8px}.brand-row{align-items:center}.detail-top h2{font-size:22px}}
  .conclusion{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line2);border-radius:14px;padding:20px 24px;margin:0 0 18px;box-shadow:var(--shadow)}.conclusion.ok{border-left-color:var(--ok)}.conclusion.warn{border-left-color:#c58b33}.conclusion.bad{border-left-color:var(--bad)}.conclusion h2{font-size:26px;line-height:1.35;margin:2px 0 0;overflow-wrap:anywhere}.conclusion .main-number{margin:10px 0 0;font-size:17px}.conclusion .main-number span{color:var(--muted);margin-left:6px}.conclusion .biggest-limit{margin:8px 0 0;color:var(--muted)}
  .backtest{margin:6px 0 22px}.bt-blocks{display:grid;gap:12px}.bt-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}.bt-block h4{display:flex;align-items:center;gap:9px;font-size:16px;margin:0 0 4px}.bt-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand2);color:var(--brand);font-size:13px;font-weight:760}.not-backtested{margin:8px 0 0;background:var(--soft);border:1px dashed var(--line2);border-radius:10px;padding:11px 14px;color:var(--muted)}.engine-line{margin:10px 0 0;color:var(--muted)}.formula-title{font-size:14px;margin:16px 0 0}.sim-note{color:var(--warn);font-size:12px}.kelly-line{margin:8px 0 10px}.kelly-compare{margin-top:6px}.kelly-compare h5{margin:0;font-size:15px}.kelly-note{margin:10px 0 0;color:var(--brand);font-weight:650}caption{caption-side:top;text-align:left;color:var(--muted);font-size:12px;padding:6px 2px}.diagnosis{margin:0 0 22px}.diagnosis-item+.diagnosis-item{margin-top:10px}.diagnosis-item h4{margin:0;font-size:15px}.muted-note{color:var(--muted);font-size:13px;margin:10px 0 0}
  .bt-blocks.all-empty{grid-template-columns:repeat(2,minmax(0,1fr))}.bt-blocks.all-empty .bt-block{padding:12px 16px}@media(max-width:680px){.bt-blocks.all-empty{grid-template-columns:1fr}}
  @media(max-width:520px){.detail-top>div>h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.context-copy p{display:none}.conclusion{padding:16px 18px}.conclusion h2{font-size:21px}.bt-block{padding:14px}}
</style>

<body>
<a class="skip" href="#workspace">跳到当前页面内容</a>
<header class="app-head"><div class="brand-row"><div class="brand"><span class="brand-mark" aria-hidden="true">R</span><div><h1>Research 研究工作台</h1><p>Cycle × Research × Desk · 用证据理解策略，不替你做交易决定</p></div></div><span class="read-only">只读安全模式</span></div></header>
<section class="context-shell" aria-label="当前查看范围"><div class="context-row"><div class="context-copy"><p class="eyebrow" id="context-eyebrow">当前查看范围</p><h2 id="context-title">正在读取…</h2><p id="context-subtitle">读取 Desk 策略目录与真实研究关联</p></div><div class="context-select" id="context-picker"></div></div></section>
<div class="tab-shell"><nav id="nav" aria-label="Research 用户任务"></nav></div>
<main id="workspace" tabindex="-1"><div class="loading" role="status">正在读取 Desk 策略目录…</div></main>
<script>
'use strict';
const TOP_ROUTES=['strategies','experiments','shadow','promotion','runtime-status'];
const KNOWN_ROUTES=new Set([...TOP_ROUTES,'strategy-detail','runtime-research-loop','races']);
const $=(id)=>document.getElementById(id);
const esc=(value)=>String(value==null?'':value).replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const stateTone=(state)=>({AVAILABLE:'ok',CONNECTED:'ok',ACTUAL_CASE_CONNECTED:'ok',READY:'ok',VALID:'ok',RUNNING:'ok',OPEN:'ok',HAS_RESEARCH_QUESTION:'info',HAS_LOCKED_RESULT:'info',RESULT_LOCKED:'info',RESEARCHING:'info',HAS_FORWARD_RUN:'info',DECIDED:'info',OBSERVING:'info',FROZEN_BASELINE:'info',RUN_OFF:'warn',NOT_YET_EFFECTIVE:'warn',EMPTY:'',NOT_CONNECTED:'',NO_ACTUAL_CASE:'warn',DEGRADED:'warn',STALE:'warn',UNKNOWN:'warn',MISSING:'bad',UNAVAILABLE:'bad',INVALID:'bad',BLOCKED:'bad',NOT_VERIFIED:'warn',CONTROLLED_VERIFIED:'info',TARGET_DELIVERED:'ok',OUT_OF_SCOPE:'',CLOSED:''})[state]||'';
const pill=(label,state='')=>`<span class="pill ${stateTone(state)}">${esc(label)}</span>`;
const tech=(items,title='技术详情')=>{const rows=(items||[]).filter(Boolean);if(!rows.length)return '';return `<details class="technical"><summary>${esc(title)}</summary><div class="detail-body"><dl>${rows.map((item)=>`<dt>${esc(item.label)}</dt><dd><code>${esc(item.value)}</code></dd>`).join('')}</dl></div></details>`;};
const answerPanel=(view)=>`<section class="answer-panel" aria-labelledby="page-question"><p class="eyebrow">本页要回答</p><h2 id="page-question">${esc(view.question)}</h2><p class="answer">${esc(view.answer)}</p><p class="next">下一步：${esc(view.next_step)}</p></section>`;
const emptyState=(title,copy)=>`<section class="empty-state"><h3>${esc(title)}</h3><p>${esc(copy)}</p></section>`;
function routeInfo(){const raw=location.hash.slice(1)||'strategies';const [name,query='']=raw.split('?');return {name:KNOWN_ROUTES.has(name)?name:'strategies',params:new URLSearchParams(query)};}
function effectiveRoute(){const name=routeInfo().name;return name==='runtime-research-loop'?'strategy-detail':name==='races'?'experiments':name;}
function detailHref(strategyRef,section='runtime'){return `#strategy-detail?strategy=${encodeURIComponent(strategyRef)}&section=${encodeURIComponent(section)}`;}
function renderNavigation(model){const route=effectiveRoute();const current=route==='strategy-detail'?'strategies':route;$('nav').innerHTML=model.navigation.map((item)=>`<a href="#${esc(item.route)}" aria-current="${item.route===current?'page':'false'}">${esc(item.label)}</a>`).join('');}
function renderContext(model){const route=effectiveRoute();const detail=route==='strategy-detail';const data=route==='runtime-status';$('context-eyebrow').textContent=detail?'当前 Desk 策略':'当前查看范围';$('context-title').textContent=detail?model.context.title:(route==='strategies'?'Desk 系统策略目录':model.navigation.find((item)=>item.route===route)?.label||'Research 研究工作台');$('context-subtitle').textContent=detail?model.context.subtitle:(route==='strategies'?'运行、观察与历史分开；Research 关联不等于策略运行状态':model.safety_label);const picker=$('context-picker');if((detail||data)&&model.context.options.length){picker.innerHTML=`<label for="strategy-picker">切换 Desk 策略</label><select id="strategy-picker">${model.context.options.map((item)=>`<option value="${esc(item.strategy_ref)}" ${item.selected?'selected':''}>${esc(item.market_label)} / ${esc(item.strategy_label)}</option>`).join('')}</select>`;$('strategy-picker').addEventListener('change',(event)=>{location.hash=detail?detailHref(event.target.value,routeInfo().params.get('section')||'runtime'):`#runtime-status?strategy=${encodeURIComponent(event.target.value)}`;});}else picker.innerHTML='';}
function strategyCard(item){return `<a class="strategy-card" href="${detailHref(item.strategy_ref)}"><span class="market-label">${esc(item.market_label)}</span><h3>${esc(item.name)}</h3><div class="status-row">${pill(item.lifecycle.label,item.lifecycle.code)}${pill(item.mode_label,item.role==='SHADOW'?'OBSERVING':'')}</div><p class="research-line">Research：${esc(item.research.label)}</p><span class="open-label">查看完整策略详情 →</span></a>`;}
function renderOverview(model){const view=model.views.strategies;if(model.strategy_directory.state!=='AVAILABLE')return `${answerPanel(view)}<section class="error-state" role="alert"><h2>Desk 策略目录暂时不可读取</h2><p>页面没有退回内部实验或样例数据。请检查本地 Desk 只读源后重试。</p><button type="button" class="retry">重试</button></section>`;const current=model.strategy_directory.current;const history=model.strategy_directory.history;return `${answerPanel(view)}<section class="section" aria-labelledby="current-title"><div class="section-head"><h2 id="current-title">运行与观察</h2><p>${current.length} 项 · 生命周期来自 Desk</p></div><div class="strategy-grid">${current.map(strategyCard).join('')}</div></section><section class="section" aria-labelledby="history-title"><div class="section-head"><h2 id="history-title">历史与收尾</h2><p>${history.length} 项 · 与当前运行分开</p></div><div class="strategy-grid">${history.map(strategyCard).join('')}</div></section>`;}
function sectionNav(strategyRef){const items=[['runtime','运行概览'],['health','体检与证据'],['research','研究与对比'],['forward','前向观察'],['review','复盘与采用']];return `<nav class="section-nav" aria-label="策略详情章节">${items.map(([key,label])=>`<a href="${detailHref(strategyRef,key)}">${label}</a>`).join('')}</nav>`;}
function linkCard(item,title){return `<article class="card"><div class="fact-head"><h3>${esc(title)}</h3>${pill(item.conclusion_label,item.conclusion)}</div><dl>${item.strategy_name?`<dt>策略</dt><dd>${esc(item.strategy_name)}</dd>`:''}<dt>问题</dt><dd>${esc(item.question_label)}</dd><dt>证据冻结</dt><dd>${item.has_frozen_experiment?'已冻结':'尚未冻结'}</dd><dt>锁定结果</dt><dd>${item.has_locked_result?'已有锁定结果':'尚无锁定结果'}</dd><dt>Desk 决定</dt><dd>${esc(item.adoption_label)}</dd></dl>${tech(item.technical)}</article>`;}
const usd=(value,digits=2)=>Number.isFinite(value)?new Intl.NumberFormat('zh-CN',{style:'currency',currency:'USD',minimumFractionDigits:digits,maximumFractionDigits:digits}).format(value):'未知';

  const forward=view.forward;
  const hkBlock=forward.hk_items.length?`<div class="grid two">${forward.hk_items.map(renderHkItem).join('')}</div><p class="muted-note">HK 上的登记由工程实施者在 ${esc(forward.hk_verified_at)} 只读核对；这里不放结果数字，导入 QRP 后才进入 QRP 台账。</p>`:'';
  const qrpBlock=forward.items.length?`<div class="grid two">${forward.items.map((item)=>`<article class="card"><h3>${esc(item.state_label)}</h3><p>${esc(item.sample_label)}</p><div class="status-row">${pill(item.claim_label,item.claim_label.includes('达到')?'VALID':'DEGRADED')}</div>${tech(item.technical)}</article>`).join('')}</div>`:'';
  return `<a class="breadcrumb" href="#strategies">← 返回策略总览</a><header class="detail-top"><div><p class="eyebrow">${esc(strategy.market_label)} · 策略详情</p><h2>${esc(strategy.name)}</h2><p>${esc(view.runtime.answer)}</p><div class="status-row">${pill(strategy.lifecycle.label,strategy.lifecycle.code)}${pill(strategy.mode_label,strategy.role==='SHADOW'?'OBSERVING':'')}${pill(strategy.research.label,strategy.research.code)}${health.diagnostic?.state==='VERIFIED'?pill('最近实际运行已核对','VALID'):''}</div></div></header>${renderConclusion(view.conclusion)}${sectionNav(strategy.strategy_ref)}<section class="section detail-section" id="detail-runtime"><div class="section-head"><h2>运行概览</h2><p>回测结论先行，其后是当前身份</p></div>${renderBacktest(view.backtest)}${renderDiagnosisList(view.diagnosis_list)}<div class="grid two"><article class="card connected"><h3>当前身份与状态</h3><dl><dt>市场</dt><dd>${esc(strategy.market_label)}</dd><dt>运行模式</dt><dd>${esc(strategy.mode_label)}</dd><dt>生命周期</dt><dd>${esc(strategy.lifecycle.label)}</dd><dt>Research 关联</dt><dd>${esc(strategy.research.label)}</dd>${selected?`<dt>运行截至</dt><dd>${esc(selected.runtime.as_of)}</dd>`:''}</dl></article><article class="card"><h3>目前能知道什么</h3><p>${selected?'该策略已接入 Research：回测结论见上方，最近一段实际运行的核对见「体检与证据完整性」。':'Desk 已登记这项策略，但 QRP 尚无可归属于它的真实 case，因此不显示绩效、体检或研究结论。'}</p></article></div></section><section class="section detail-section" id="detail-health"><div class="section-head"><h2>体检与证据完整性</h2><p>${esc(health.summary||health.answer)}</p></div>${diagnostic}<div style="margin-top:10px">${blockers}</div></section><section class="section detail-section" id="detail-research"><div class="section-head"><h2>研究问题与方案对比</h2><p>${esc(view.research.answer)}</p></div>${view.research.items.length?view.research.items.map((item)=>linkCard(item,'研究问题与对比')).join(''):emptyState('暂无真实研究问题','这里不会用其他市场或工程样例填满页面。Desk 复盘形成明确问题后，才冻结内容并进入评价。')}</section><section class="section detail-section" id="detail-forward"><div class="section-head"><h2>前向观察</h2><p>${esc(forward.answer)}</p></div>${hkBlock}${qrpBlock}${forward.hk_items.length||forward.items.length?'':emptyState('暂无前向观察','只有锁定研究结论进入原前向流程后，才累计独立样本。')}</section><section class="section detail-section" id="detail-review"><div class="section-head"><h2>复盘与采用</h2><p>${esc(view.review.answer)}</p></div>${view.review.items.length?view.review.items.map((item)=>linkCard(item,'Desk 往返与采用')).join(''):emptyState('尚未完成 Desk 往返','没有可回到 Desk 的锁定结论；系统不会代替用户作出采用决定。')}<div class="status-row">${pill(view.review.production_effect_label,view.review.production_effect_label.includes('无')?'VALID':'DEGRADED')}</div></section>${tech(view.technical,'查看本策略技术引用')}`;
}
function renderResearch(model){const view=model.views.experiments;const comparisons=model.views.races;return `${answerPanel(view)}<section class="section" id="research-questions"><div class="section-head"><h2>真实研究问题</h2><p>跨策略队列</p></div>${view.items.length?view.items.map((item)=>linkCard(item,'研究问题')).join(''):emptyState('研究队列为空','这里不会用平台工程实验替代 Desk 的真实问题。先由 Desk 复盘形成明确问题，再按原研究槽顺序接入。')}</section><section class="section" id="research-comparison"><div class="section-head"><h2>锁定方案对比</h2><p>原版、候选与适当基准</p></div>${comparisons.items.length?comparisons.items.map((item)=>linkCard(item,'方案对比')).join(''):emptyState('还没有锁定对比结果','当前首案的原生扫描、基准行情与完整净成本尚未齐全，不能提前给出胜负。')}</section>`;}
function renderShadow(model){const view=model.views.shadow;return `${answerPanel(view)}${view.hk_items.length?`<section class="section"><div class="section-head"><h2>已在 HK 运行</h2><p>登记的运行位置与起始日；导入 QRP 前不放结果数字</p></div><div class="grid two">${view.hk_items.map(renderHkItem).join('')}</div></section>`:''}${view.items.length?`<section class="section"><div class="section-head"><h2>QRP 已导入</h2></div><div class="grid two">${view.items.map((item)=>`<article class="card"><h3>${esc(item.state_label)}</h3><p>${esc(item.sample_label)}</p><div class="status-row">${pill(item.claim_label,item.claim_label.includes('达到')?'VALID':'DEGRADED')}</div>${tech(item.technical)}</article>`).join('')}</div></section>`:(view.hk_items.length?'':emptyState('还没有真实前向观察','工程 shadow 样例不会显示为 Desk 策略的前向证据。'))}`;}
function renderPromotion(model){const view=model.views.promotion;return `${answerPanel(view)}${view.items.length?`<section class="section">${view.items.map((item)=>linkCard(item,'Desk 往返与采用')).join('')}</section>`:emptyState('还没有完成真实往返','当前没有可回到 Desk 的锁定研究结论；未实现的采用能力不会被写成“未采用”。')}<section class="section"><div class="section-head"><h2>用户决定与系统结论分开</h2><p>${esc(view.production_effect_label)}</p></div><div class="safety-grid"><div class="safety-item">Research 不能下单</div><div class="safety-item">系统不能代替用户采用</div><div class="safety-item">不写生产参数</div></div></section>${authorityDisclosure(model)}`;}
function renderRuntime(model){const view=model.views['runtime-status'];return `${answerPanel(view)}<section class="section"><div class="section-head"><h2>所选策略的实际输入</h2><p>${view.sources.length} 个已登记文件</p></div>${view.sources.length?`<div class="grid">${view.sources.map((source)=>`<article class="card"><h3>${esc(source.label)}</h3><p>${esc(source.file_name)}</p><div class="status-row">${pill(source.state_label,'CONNECTED')}</div>${tech([source.technical],'查看原始路径')}</article>`).join('')}</div>`:emptyState('没有已登记的 QRP 实际输入','Desk 策略已登记不等于 Research 输入已接入；未登记也不等于数值为 0。')}</section>${view.blockers.length?`<section class="section"><div class="section-head"><h2>数据缺口</h2><p>影响完整回放与净核算</p></div>${view.blockers.map((item)=>`<article class="card blocker"><h3>${esc(item.label)}</h3><p>${esc(item.impact)}</p></article>`).join('')}</section>`:''}<section class="section"><div class="grid two"><article class="card"><h3>运行状态来源</h3><p>${esc(view.runtime_binding_label)}</p></article><article class="card"><h3>Research 隔离</h3><p>${esc(view.isolation.label)}</p><div class="status-row">${pill('下单：禁止','VALID')}${pill('激活：禁止','VALID')}${pill('写运行态：禁止','VALID')}</div></article></div></section><section class="section"><div class="section-head"><h2>V8.1 产品阶段证据</h2><p>工程通过不等于产品交付</p></div><div class="milestones">${view.milestones.map((stage)=>`<article class="milestone"><strong>${esc(stage.stage)} · ${esc(stage.label)}</strong>${pill(stage.state_label,stage.state)}<small>${esc(stage.environment_label)}</small>${stage.user_result?`<p>${esc(stage.user_result)}</p>`:''}</article>`).join('')}</div></section>${productEvidenceDisclosure(model)}${deskSourceDisclosure(model)}${engineeringDisclosure(model.engineering_samples)}`;}
function engineeringDisclosure(samples){return `<details class="engineering-samples"><summary>平台工程与历史样例（不属于 Desk 当前策略）</summary><div class="detail-body"><p><strong>${esc(samples.notice)}</strong></p><ul>${samples.groups.map((group)=>`<li>${esc(group.label)}：${group.count} 个${group.technical_ids.length?`<details><summary>查看内部 ID</summary><div class="detail-body"><ul>${group.technical_ids.map((id)=>`<li><code>${esc(id||'MISSING')}</code></li>`).join('')}</ul></div></details>`:''}</li>`).join('')}</ul><p>原始只读接口：${samples.raw_readonly_endpoints.map((endpoint)=>`<code>${esc(endpoint)}</code>`).join(' · ')}</p></div></details>`;}
function productEvidenceDisclosure(model){const t=model.technical;const health=model.views['strategy-detail'].health;const diagnostic=health.diagnostic;const stage=health.product_stage;return `<details><summary>V8.1 产品里程碑真相（技术详情）</summary><div class="detail-body"><p>冻结验收、版本化修订、实际证据门禁和完成权威共同决定阶段；页面存在或测试通过不会把 <code>NOT_VERIFIED</code> 变成已交付。</p><dl><dt>冻结验收</dt><dd><code>${esc(t.product_acceptance_ref)}</code></dd><dt>版本化修订</dt><dd><code>${esc((t.product_acceptance_amendment_refs||[]).join(' · '))}</code></dd><dt>实际证据门禁</dt><dd>必须绑定同一 case 的真实用户任务与文件哈希证据</dd><dt>完成权威</dt><dd><code>${esc(t.completion_authority)}</code></dd><dt>实际入口</dt><dd><code>/#strategy-detail?strategy=US_V5_ETF_3000USD&amp;section=health</code></dd><dt>M1 阶段</dt><dd>${esc(stage?.state_label||'尚未验证')}</dd><dt>交付环境</dt><dd>${esc(stage?.environment_label||'尚无环境证据')}</dd><dt>用户结果</dt><dd>${diagnostic?.state==='VERIFIED'?'可追踪 MSFU 决策并核对现金、持仓、费用和 Research 净结果':'尚不能完成本案完整体检任务'}</dd><dt>诊断能力</dt><dd>${diagnostic?.state==='VERIFIED'?'同窗原生回放、决策链与净账户对账已通过内容校验':'尚未取得可用的 sealed 诊断输入'}</dd><dt>限制/异常</dt><dd>${diagnostic?.state==='VERIFIED'?'12-session 样本不足（要求 20）；监管费为 stand-alone 研究模型':'按页面当前缺口为准；未知不得填 0'}</dd></dl></div></details>`;}
function deskSourceDisclosure(model){const p=model.technical.desk_directory_provenance;return `<details><summary>查看 Desk 策略目录来源</summary><div class="detail-body">${p?`<p>策略范围、生命周期与名称来自同一组 Desk 只读模块。</p><ul>${p.files.map((item)=>`<li><code>${esc(item.file)}</code><br />SHA-256：<code>${esc(item.sha256)}</code></li>`).join('')}</ul>`:`<p>目录来源不可用：<code>${esc(model.technical.desk_directory_error||'UNKNOWN')}</code></p>`}</div></details>`;}
function authorityDisclosure(model){return `<details><summary>查看四方权威边界</summary><div class="detail-body"><ul><li>${esc(model.authority.runtime)}</li><li>${esc(model.authority.research)}</li><li>${esc(model.authority.review_and_adoption)}</li><li>${esc(model.authority.cycle)}</li></ul></div></details>`;}
const renderers={strategies:renderOverview,'strategy-detail':renderDetail,experiments:renderResearch,shadow:renderShadow,promotion:renderPromotion,'runtime-status':renderRuntime};
let loadedStrategyRef=null;let lastModel=null;
function requestedStrategy(){return routeInfo().params.get('strategy');}
function scrollToSection(){const section=routeInfo().name==='runtime-research-loop'?'health':routeInfo().params.get('section');if(section&&section!=='runtime')requestAnimationFrame(()=>document.getElementById(`detail-${section}`)?.scrollIntoView({block:'start'}));}
function render(model){lastModel=model;renderContext(model);renderNavigation(model);const route=effectiveRoute();$('workspace').innerHTML=renderers[route](model);const label=route==='strategy-detail'?'策略详情':model.navigation.find((item)=>item.route===route)?.label||'Research 研究工作台';document.title=`${label} · Research 研究工作台`;$('workspace').querySelector('.retry')?.addEventListener('click',()=>load(loadedStrategyRef));scrollToSection();}
async function load(strategyRef=requestedStrategy()||loadedStrategyRef){const workspace=$('workspace');workspace.innerHTML='<div class="loading" role="status">正在读取 Desk 策略目录与研究关联…</div>';try{const query=strategyRef?`?strategy_ref=${encodeURIComponent(strategyRef)}`:'';const response=await fetch(`/api/workspace${query}`,{headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`服务返回 ${response.status}`);const model=await response.json();if(model.error)throw new Error(model.error);loadedStrategyRef=model.context.selected_strategy_ref;render(model);}catch(error){workspace.innerHTML=`<section class="error-state" role="alert"><h2>暂时无法读取 Research 数据</h2><p>${esc(error.message)}</p><button type="button" class="retry">重试</button></section>`;workspace.querySelector('.retry').addEventListener('click',()=>load(strategyRef));}}
window.addEventListener('hashchange',()=>{const info=routeInfo();if(!KNOWN_ROUTES.has(info.name)){location.hash='strategies';return;}if(info.name==='runtime-research-loop'){const canonical=lastModel?.context.canonical_current_strategy_ref;if(canonical&&canonical!==loadedStrategyRef){load(canonical);return;}}const wanted=requestedStrategy();if(wanted&&wanted!==loadedStrategyRef)load(wanted);else if(lastModel){render(lastModel);$('workspace').focus({preventScroll:true});}});
load();
</script>
</body>
</html>
