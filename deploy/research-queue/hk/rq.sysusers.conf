# systemd-sysusers: queue users have no shell; only rq-gw (Q2) will ever hold the DeepSeek key file.
g rq - -
u research-queue - "research queue" /var/lib/research-queue /usr/sbin/nologin
u rq-agent - "research queue agent" /var/lib/research-queue /usr/sbin/nologin
u rq-gw - "research queue gateway" /var/lib/research-queue/gateway /usr/sbin/nologin
m research-queue rq
